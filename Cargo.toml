[package]
name = "pyhone"
version = "0.1.6"
edition = "2021"
rust-version = "1.95"

[dependencies]
ruff_python_parser = "0.0.9"
ruff_python_ast = "0.0.9"
ruff_text_size = "0.0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"
